name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build release binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: true
          - name: ubuntu-amd32
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: true
          - name: ubuntu-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: true
          - name: ubuntu-arm32
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            archive_ext: tar.gz
            use_cross: true
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            use_cross: false
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          asset="sec-cli-${{ matrix.target }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/sec" "dist/${asset}/sec"
          cp README.md README.zh-CN.md LICENSE "dist/${asset}/"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"

      - name: Package Windows binary
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $asset = "sec-cli-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$asset" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sec.exe" "dist/$asset/sec.exe"
          Copy-Item "README.md" "dist/$asset/README.md"
          Copy-Item "README.zh-CN.md" "dist/$asset/README.zh-CN.md"
          Copy-Item "LICENSE" "dist/$asset/LICENSE"
          Compress-Archive -Path "dist/$asset/*" -DestinationPath "dist/$asset.zip" -Force

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sec-cli-*.tar.gz
            dist/sec-cli-*.zip
          generate_release_notes: true
